apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  # Objeto que va a escalar (Deployment o StatefulSet)
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment

  # Rango de réplicas permitidas
  minReplicas: 2
  maxReplicas: 10

  # Métricas para decidir cuándo escalar
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Sube réplicas si el CPU promedio supera el 70% del 'request'
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 # Sube réplicas si la RAM promedio supera el 80% del 'request'
